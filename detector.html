<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lie Truth Detector | Premium Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --lie-color: #ff4757;
            --truth-color: #2ed573;
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        .container {
            position: relative;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 500px;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .detector-box {
            position: relative;
            width: 300px;
            height: 150px;
            margin: 0 auto 3rem;
        }

        /* The Semi-Circle Gauge */
        .gauge-background {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            clip-path: inset(0 0 50% 0);
            /* Show only top half */
            background: conic-gradient(from 270deg,
                    var(--lie-color) 0deg,
                    var(--lie-color) 90deg,
                    var(--truth-color) 90deg,
                    var(--truth-color) 180deg);
            mask: radial-gradient(circle, transparent 65%, black 66%);
            -webkit-mask: radial-gradient(circle, transparent 65%, black 66%);
            opacity: 0.8;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.3));
        }

        .labels {
            position: absolute;
            width: 100%;
            top: 60%;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 1rem;
            letter-spacing: 0.15em;
        }

        .label-lie {
            color: var(--lie-color);
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        .label-truth {
            color: var(--truth-color);
            text-shadow: 0 0 10px rgba(46, 213, 115, 0.5);
        }

        /* The Needle */
        .needle-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 6px;
            height: 125px;
            background: white;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(0deg);
            transition: transform 2s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 6px 6px 0 0;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        .needle-container::after {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid white;
        }

        .needle-center {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 30px;
            background: white;
            border-radius: 50%;
            border: 6px solid var(--bg-dark);
            z-index: 11;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .btn-check {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 1.2rem 3rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            position: relative;
            overflow: hidden;
        }

        .btn-check:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.5);
            filter: brightness(1.1);
        }

        .btn-check:active {
            transform: translateY(1px);
        }

        /* Popup Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .modal-content {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 5rem;
            border-radius: 3rem;
            transform: scale(0.7);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            box-shadow: 0 0 100px rgba(99, 102, 241, 0.2);
        }

        .modal-content h2 {
            font-size: 5rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.4);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        .show-modal {
            display: flex;
            opacity: 1;
        }

        .show-modal .modal-content {
            transform: scale(1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(99, 102, 241, 0.7);
            box-shadow: 0 0 20px var(--primary);
            animation: scan 2s infinite linear;
            display: none;
            z-index: 5;
            border-radius: 2px;
        }

        @keyframes scan {
            0% {
                top: 0;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="scan-line" id="scanLine"></div>
        <h1>AI TRUTH DETECTOR</h1>

        <div class="detector-box">
            <div class="gauge-background"></div>
            <div class="labels">
                <span class="label-lie">Lie</span>
                <span class="label-truth">Truth</span>
            </div>
            <div class="needle-container" id="needle"></div>
            <div class="needle-center"></div>
        </div>

        <button class="btn-check" onclick="checkTruth()">Check Reality</button>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2 id="popupText">ASLINYA EMANG SUKA PEGANG PEGANG IQBAL</h2>
        </div>
    </div>

    <script>
        function checkTruth() {
            const needle = document.getElementById('needle');
            const scanLine = document.getElementById('scanLine');
            const modal = document.getElementById('modal');
            const btn = document.querySelector('.btn-check');

            // Disable button during analysis
            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.innerText = 'Analyzing...';

            // Start scanning effect
            scanLine.style.display = 'block';

            // Initial movement: slight jitter/oscillation to simulate "thinking"
            let count = 0;
            const jitterInterval = setInterval(() => {
                const jitter = (Math.random() * 20) - 10;
                needle.style.transform = `translateX(-50%) rotate(${jitter}deg)`;
                count++;
                if (count > 15) clearInterval(jitterInterval);
            }, 80);

            setTimeout(() => {
                clearInterval(jitterInterval);

                // USER REQUIREMENT: Move to LIE (Red)
                // Red is on the left half of the gauge (-90 to 0 degrees)
                // Let's settle at -60 degrees for a clear "Lie" reading
                needle.style.transform = 'translateX(-50%) rotate(-60deg)';
                scanLine.style.display = 'none';

                // USER REQUIREMENT: After 3 seconds, show popup
                setTimeout(() => {
                    modal.classList.add('show-modal');

                    // Reset UI after viewing popup (auto-reset after 5s)
                    setTimeout(() => {
                        modal.classList.remove('show-modal');
                        btn.disabled = false;
                        btn.style.opacity = '1';
                        btn.innerText = 'Check Reality';
                        needle.style.transform = 'translateX(-50%) rotate(0deg)';
                    }, 5000);
                }, 3000);

            }, 2000); // Analysis takes 2 seconds
        }

        // Close modal on background click
        document.getElementById('modal').addEventListener('click', () => {
            document.getElementById('modal').classList.remove('show-modal');
        });
    </script>
</body>

</html>
